name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The oldest version requires-python in pyproject.toml allows.
      OLDEST_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The last version listed is the default python for the steps below.
          python-version: |
            ${{ env.OLDEST_PYTHON }}
            3.12
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-test.txt -e .
      - run: visual-image-diff --help
      - run: python -m pytest
      - name: Run the tests on the oldest supported Python
        run: |
          venv="$RUNNER_TEMP/oldest-python"
          "python$OLDEST_PYTHON" -m venv "$venv"
          "$venv/bin/python" -m pip install -r requirements-test.txt -e .
          "$venv/bin/python" -m pytest
      - name: Run the documented synthetic example
        run: visual-image-diff examples/reference examples/new output/diff
      - name: Check the example wrote exactly one diff image
        run: test "$(ls output/diff)" = diff_card.png
